<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIM Engine | Forma Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ads: {
              blue:       '#0696D7',
              'blue-dark':'#0572a1',
              navy:       '#012B44',
              gray:       '#f5f5f5',
              border:     '#e0e0e0',
              text:       '#3d3d3d',
              muted:      '#757575',
            },
            be: {
              charcoal:   '#2D2926',
              green:      '#82B891',
              'green-dark':'#6a9a78',
            }
          },
          fontFamily: {
            sans: ['"Artifakt Element"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-ads-gray text-ads-text min-h-screen flex flex-col">

  <!-- Top nav (shown after login) -->
  <header id="app-header" class="hidden bg-be-charcoal text-white border-b border-black/20 px-6 h-12 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4">
      <img src="logo.png" alt="BIM Engine" class="h-7 w-auto brightness-0 invert" />
      <span class="text-white/30 text-xs">|</span>
      <span class="text-white/70 text-xs tracking-wide">Forma Super Admin</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-label" class="text-white/60 text-xs"></span>
      <button onclick="logout()" class="text-xs text-white/50 hover:text-white transition-colors">Sign out</button>
    </div>
  </header>

  <!-- Main layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar (shown after login) -->
    <nav id="sidebar" class="hidden w-56 bg-white border-r border-ads-border flex flex-col shrink-0">
      <!-- Nav items injected by app.js -->
    </nav>

    <!-- Content area -->
    <main id="main-content" class="flex-1 overflow-auto">

      <!-- LOGIN PAGE (default view) -->
      <div id="login-page" class="min-h-screen flex flex-col items-center justify-center bg-ads-gray">
        <div class="bg-white rounded shadow-sm border border-ads-border w-full max-w-sm p-8 flex flex-col items-center gap-6">

          <!-- Logo area -->
          <div class="flex flex-col items-center gap-3">
            <img src="logo.png" alt="BIM Engine" class="h-20 w-auto" />
            <div class="text-center">
              <div class="font-semibold text-be-charcoal text-base tracking-wide">Forma Super Admin</div>
              <div class="text-ads-muted text-xs mt-0.5">Internal tool</div>
            </div>
          </div>

          <div class="w-full border-t border-ads-border"></div>

          <!-- Auth button -->
          <div class="flex flex-col items-center gap-3 w-full">
            <p class="text-ads-muted text-xs text-center">Sign in with your Autodesk account to continue.</p>
            <button
              id="auth-btn"
              onclick="login()"
              class="w-full flex items-center justify-center gap-2 bg-be-charcoal hover:bg-black text-white text-sm font-medium py-2.5 px-4 rounded transition-colors"
            >
              Sign in with Autodesk
            </button>
          </div>

          <p class="text-ads-muted text-[11px] text-center">
            Access is restricted to authorised BIM Engine staff.
          </p>
        </div>
      </div>

    </main>
  </div>

  <!-- SheetJS for XLSX parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- JSZip for reading drawing packages (.zip) in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- APS Viewer -->
  <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css"/>
  <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>

  <script src="api.js"></script>
  <script src="modellkontroll.js"></script>
  <script src="modellkontroll-rapport.js"></script>
  <script src="ritningsgranskning-las.js"></script>
  <script src="ritningsgranskning-regler.js"></script>
  <script src="ritningsgranskning.js"></script>
  <script src="ritningsgranskning-rapport.js"></script>
  <script src="veckokontroll.js"></script>
  <script src="veckokontroll-las.js"></script>
  <script src="veckokontroll-kor.js"></script>
  <script src="app.js"></script>
</body>
</html>
