<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BE Forma Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ads: {
              blue:       '#0696D7',
              'blue-dark':'#0572a1',
              navy:       '#012B44',
              gray:       '#f5f5f5',
              border:     '#e0e0e0',
              text:       '#3d3d3d',
              muted:      '#757575',
            },
            be: {
              charcoal:   '#2D2926',
              green:      '#82B891',
              'green-dark':'#6a9a78',
            }
          },
          fontFamily: {
            sans: ['"Artifakt Element"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- That Open (Fragments) for the light model in Issues. Exact versions; one shared copy of three.
       Loaded only when the model is shown (tools/issues/issues-frag.js). The map must be complete:
       components imports three/examples/..., and a failed import is remembered for the page.
       web-ifc's .js and .wasm must be the same version (wasm path is set in the code). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.182.0",
      "three/": "https://esm.sh/three@0.182.0/",
      "web-ifc": "https://esm.sh/web-ifc@0.0.77",
      "camera-controls": "https://esm.sh/camera-controls@3.1.2?external=three",
      "potree-core": "https://esm.sh/potree-core@2.0.17?external=three",
      "@thatopen/fragments": "https://esm.sh/@thatopen/fragments@3.6.0?external=three,web-ifc",
      "@thatopen/components": "https://esm.sh/@thatopen/components@3.6.0?external=three,web-ifc,camera-controls,@thatopen/fragments",
      "@thatopen/components-front": "https://esm.sh/@thatopen/components-front@3.6.0?external=three,web-ifc,camera-controls,potree-core,@thatopen/fragments,@thatopen/components"
    }
  }
  </script>
  <style>
    @keyframes ilm-stapel-gar { 0% { left: -33%; } 100% { left: 100%; } }
    .ilm-stapel-gar { animation: ilm-stapel-gar 1.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .ilm-stapel-gar { animation: none; left: 0; width: 100%; opacity: .5; } }
  </style>
</head>
<body class="bg-ads-gray text-ads-text min-h-screen flex flex-col">

  <!-- Top nav (shown after login) -->
  <header id="app-header" class="hidden bg-be-charcoal text-white border-b border-black/20 px-6 h-12 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4">
      <img src="logo.png" alt="BIM Engine" class="h-7 w-auto brightness-0 invert" />
      <span class="text-white/30 text-xs">|</span>
      <span class="text-white/70 text-xs tracking-wide">BE Forma Console</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-label" class="text-white/60 text-xs"></span>
      <button onclick="logout()" class="text-xs text-white/50 hover:text-white transition-colors">Sign out</button>
    </div>
  </header>

  <!-- Main layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar (shown after login) -->
    <nav id="sidebar" class="hidden w-56 bg-white border-r border-ads-border flex flex-col shrink-0">
      <!-- Nav items injected by app.js -->
    </nav>

    <!-- Content area -->
    <main id="main-content" class="flex-1 overflow-auto">

      <!-- LOGIN PAGE (default view) -->
      <div id="login-page" class="min-h-screen flex flex-col items-center justify-center bg-ads-gray">
        <div class="bg-white rounded shadow-sm border border-ads-border w-full max-w-sm p-8 flex flex-col items-center gap-6">

          <!-- Logo area -->
          <div class="flex flex-col items-center gap-3">
            <img src="logo.png" alt="BIM Engine" class="h-20 w-auto" />
            <div class="text-center">
              <div class="font-semibold text-be-charcoal text-base tracking-wide">Forma Console</div>
            </div>
          </div>

          <div class="w-full border-t border-ads-border"></div>

          <!-- Auth button -->
          <div class="flex flex-col items-center gap-3 w-full">
            <button
              id="auth-btn"
              onclick="login()"
              class="w-full flex items-center justify-center gap-2 bg-be-charcoal hover:bg-black text-white text-sm font-medium py-2.5 px-4 rounded transition-colors"
            >
              Sign in with Autodesk
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- SheetJS for XLSX parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- JSZip for reading drawing packages (.zip) in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- APS Viewer -->
  <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css"/>
  <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>

  <!-- Appens egna filer, i den ordning de ska köras (shared/api.js först, shared/app.js sist).
       GitHub Pages låter webbläsaren använda en sparad kopia i upp till 10 minuter, så en ny
       publicering syntes inte direkt. Därför frågar webbläsaren först om varje fil har ändrats
       (ett litet anrop; svaret är 304 och kopian används när filen är oförändrad), och lägger
       sedan in filerna. async = false gör att de körs i listans ordning. Filer som laddas på
       annat sätt (omvandlingens worker) kollas också, men läggs inte in här. -->
  <script>
    (() => {
      const filer = [
        'shared/api.js',
        'tools/parameterkontroll/parameterkontroll-berakna.js',
        'tools/parameterkontroll/parameterkontroll-data.js',
        'tools/parameterkontroll/parameterkontroll.js',
        'tools/parameterkontroll/parameterkontroll-kategorier.js',
        'tools/parameterkontroll/parameterkontroll-spara.js',
        'tools/parameterkontroll/parameterkontroll-parametrar.js',
        'tools/parameterkontroll/parameterkontroll-resultat.js',
        'tools/parameterkontroll/parameterkontroll-ord.js',
        'tools/parameterkontroll/parameterkontroll-excel.js',
        'tools/parameterkontroll/parameterkontroll-historik.js',
        'tools/parameterkontroll/parameterkontroll-motor.js',
        'tools/parameterkontroll/parameterkontroll-pdf.js',
        'tools/parameterkontroll/parameterkontroll-arenden.js',
        'tools/ritningsgranskning/ritningsgranskning-las.js',
        'tools/ritningsgranskning/ritningsgranskning-regler.js',
        'tools/ritningsgranskning/ritningsgranskning.js',
        'tools/ritningsgranskning/ritningsgranskning-rapport.js',
        'tools/veckokontroll/veckokontroll.js',
        'tools/veckokontroll/veckokontroll-las.js',
        'tools/veckokontroll/veckokontroll-kor.js',
        'tools/veckokontroll/veckokontroll-baspunkt.js',
        'tools/veckokontroll/veckokontroll-not.js',
        'tools/veckokontroll/veckokontroll-parameter.js',
        'tools/vyhantering/vyhantering.js',
        'tools/vyhantering/vyhantering-publika.js',
        'tools/vyhantering/vyhantering-matris.js',
        'tools/vyhantering/vyhantering-jamfor.js',
        'tools/behorigheter/behorigheter-modell.js',
        'tools/behorigheter/behorigheter-las.js',
        'tools/behorigheter/behorigheter-skriv.js',
        'tools/behorigheter/behorigheter.js',
        'tools/issues/issues-las.js',
        'tools/issues/issues-skriv.js',
        'tools/issues/issues-flera.js',
        'tools/issues/issues-kolumner.js',
        'tools/issues/issues.js',
        'tools/issues/issues-ytor.js',
        'tools/issues/issues-modell.js',
        'tools/issues/issues-platser.js',
        'tools/issues/issues-medlem.js',
        'tools/issues/issues-visare.js',
        'tools/issues/issues-frag.js',
        'tools/issues/issues-lattmodell.js',
        'tools/issues/issues-lattmodell-fonster.js',
        'tools/granskningar/granskningar.js',
        'tools/granskningar/granskningar-filter.js',
        'tools/granskningar/granskningar-spara.js',
        'shared/app.js',
      ];
      const ocksa = ['tools/issues/issues-frag-omvandla.js'];
      const kolla = f => fetch(f, { cache: 'no-cache' }).then(r => r.blob()).catch(() => null);
      Promise.all([...filer, ...ocksa].map(kolla)).then(() => {
        for (const f of filer) {
          const s = document.createElement('script');
          s.src = f;
          s.async = false;
          document.body.appendChild(s);
        }
      });
    })();
  </script>
</body>
</html>
