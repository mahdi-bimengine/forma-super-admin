<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIM Engine | Forma Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ads: {
              blue:       '#0696D7',
              'blue-dark':'#0572a1',
              navy:       '#012B44',
              gray:       '#f5f5f5',
              border:     '#e0e0e0',
              text:       '#3d3d3d',
              muted:      '#757575',
            }
          },
          fontFamily: {
            sans: ['"Artifakt Element"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-ads-gray text-ads-text min-h-screen flex flex-col">

  <!-- Top nav (shown after login) -->
  <header id="app-header" class="hidden bg-ads-navy text-white border-b border-ads-navy px-6 h-12 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4">
      <span class="font-semibold text-sm tracking-wide">BIM Engine</span>
      <span class="text-white/30 text-xs">|</span>
      <span class="text-white/70 text-xs">Forma Super Admin</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-label" class="text-white/60 text-xs"></span>
      <button onclick="logout()" class="text-xs text-white/50 hover:text-white transition-colors">Sign out</button>
    </div>
  </header>

  <!-- Main layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar (shown after login) -->
    <nav id="sidebar" class="hidden w-56 bg-white border-r border-ads-border flex-col gap-0.5 p-2 pt-3 shrink-0">
      <!-- Nav items injected by app.js -->
    </nav>

    <!-- Content area -->
    <main id="main-content" class="flex-1 overflow-auto">

      <!-- LOGIN PAGE (default view) -->
      <div id="login-page" class="min-h-screen flex flex-col items-center justify-center bg-ads-gray">
        <div class="bg-white rounded shadow-sm border border-ads-border w-full max-w-sm p-8 flex flex-col items-center gap-6">

          <!-- Logo area -->
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 bg-ads-blue rounded flex items-center justify-center">
              <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9-4 9 4v10l-9 4-9-4V7z" />
              </svg>
            </div>
            <div class="text-center">
              <div class="font-semibold text-ads-navy text-base">Forma Super Admin</div>
              <div class="text-ads-muted text-xs mt-0.5">BIM Engine internal tool</div>
            </div>
          </div>

          <div class="w-full border-t border-ads-border"></div>

          <!-- Auth button -->
          <div class="flex flex-col items-center gap-3 w-full">
            <p class="text-ads-muted text-xs text-center">Sign in with your Autodesk account to continue.</p>
            <a
              id="auth-btn"
              href="https://aps-acc-mcp-worker.bim-engine.workers.dev/auth"
              class="w-full flex items-center justify-center gap-2 bg-ads-blue hover:bg-ads-blue-dark text-white text-sm font-medium py-2.5 px-4 rounded transition-colors"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
              </svg>
              Sign in with Autodesk
            </a>
          </div>

          <p class="text-ads-muted text-[11px] text-center">
            Access is restricted to authorised BIM Engine staff.
          </p>
        </div>
      </div>

    </main>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
